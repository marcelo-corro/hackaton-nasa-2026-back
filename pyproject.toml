[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firecal"
version = "0.1.0"
description = "Back de AIVital (NASA Space Apps 2026, desafío MODIS/VIIRS): armonización de focos, calendario de quemas y riesgo de focos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14",
  "numpy>=1.26",
  "geopandas>=0.14",
  "shapely>=2.0",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
modelo = ["lightgbm>=4.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "nbstripout>=0.7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
